spring:
  datasource:
    hikari:
      pool-name: WhatsAppHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true

logging:
  file:
    path: /app/logs

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s
