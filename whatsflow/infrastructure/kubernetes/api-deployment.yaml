apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsflow-api
  namespace: whatsflow
spec:
  replicas: 3
  selector:
    matchLabels: { app: whatsflow-api }
  template:
    metadata:
      labels: { app: whatsflow-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/harypalkar/whatsflow-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: whatsflow-secrets } }]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: whatsflow-api
  namespace: whatsflow
spec:
  selector: { app: whatsflow-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whatsflow-api
  namespace: whatsflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whatsflow-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
