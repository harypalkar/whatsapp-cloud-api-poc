apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsflow-web
  namespace: whatsflow
spec:
  replicas: 2
  selector: { matchLabels: { app: whatsflow-web } }
  template:
    metadata: { labels: { app: whatsflow-web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/harypalkar/whatsflow-web:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: whatsflow-web
  namespace: whatsflow
spec:
  selector: { app: whatsflow-web }
  ports: [{ port: 80, targetPort: 80 }]
