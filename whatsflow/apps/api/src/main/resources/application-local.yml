spring:
  datasource:
    url: jdbc:h2:mem:whatsflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.whatsflow: INFO

whatsapp:
  provider: mock

whatsflow:
  jwt:
    secret: local-dev-secret-key-must-be-32-bytes-min
  encryption:
    # Base64 of 32-byte local-only key (DO NOT use in production)
    aes-key: MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
  ai:
    default-provider: mock
    fallback-provider: mock
  demo:
    enabled: true
    email: demo@whatsflow.ai
    password: Demo@123
    full-name: Dr Rajesh Sharma
    company-name: ABC Hospital
    customers: 500
    campaigns: 20
    conversations: 150
    forms: 10
