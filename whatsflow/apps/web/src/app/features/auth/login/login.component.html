<section class="auth">
  <div class="stage">
    <div class="story">
      <p class="brand">WhatsFlow</p>
      <h1>Run WhatsApp like a growth channel</h1>
      <p>Campaigns, shared inbox, and AI — one console for your company.</p>
    </div>
    <div class="panel">
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your workspace</p>
      <form (ngSubmit)="submit()">
        <label>Email <input type="email" [(ngModel)]="email" name="email" required /></label>
        <label>Password <input type="password" [(ngModel)]="password" name="password" required /></label>
        <label class="row"><input type="checkbox" [(ngModel)]="remember" name="remember" /> Remember me</label>
        <button type="submit" [disabled]="loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button>
        <button type="button" class="demo" [disabled]="loading()" (click)="demoLogin()">
          {{ loading() ? 'Signing in…' : 'Demo Login' }}
        </button>
        <p class="hint">Use demo@whatsflow.ai · Demo@123 for the ABC Hospital workspace</p>
        <p class="err" *ngIf="error()">{{ error() }}</p>
      </form>
      <div class="links">
        <a routerLink="/auth/forgot-password">Forgot password</a>
        <a routerLink="/auth/register">Create company</a>
      </div>
      <a class="home" routerLink="/">← Back to home</a>
    </div>
  </div>
</section>
