<section class="wf-page">
  <header class="wf-page-header">
    <div>
      <p class="eyebrow">Account</p>
      <h1>Profile</h1>
      <p class="lede">Signed-in user and demo company context.</p>
    </div>
  </header>

  <div class="card wf-card">
    <div class="avatar">{{ (auth.email() || 'D').charAt(0).toUpperCase() }}</div>
    <div class="info">
      <h2>{{ auth.email() || 'Not signed in' }}</h2>
      <p class="wf-muted">{{ role }}</p>
      <div class="company">
        <span class="wf-badge">Demo company</span>
        <strong>{{ company }}</strong>
      </div>
      <dl>
        <div><dt>Tenant</dt><dd>{{ auth.tenantId() || '—' }}</dd></div>
        <div><dt>Email</dt><dd>{{ auth.email() || '—' }}</dd></div>
        <div><dt>Workspace</dt><dd>{{ company }}</dd></div>
      </dl>
    </div>
  </div>
</section>
